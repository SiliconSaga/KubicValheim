apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-dashboard
  labels:
    # The kube-prometheus-stack Grafana sidecar auto-imports ConfigMaps with this label.
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: kubicvalheim
# The "Published IP valid" panel hardcodes the address DNS publishes for
# play.terasology.org. That address now appears in THREE places that must move
# together — this panel, overlays/valheim7/prometheusrule-ip.yaml, and the
# Namecheap A record itself. It has already gone stale once: after the 2026-08-24
# node roll the panel kept counting a destroyed node's IP, so it read as a
# permanent red "published IP invalid" while the server was perfectly reachable —
# indistinguishable, at a glance, from the outage it exists to report.
# When the published IP changes, grep this component for the old value.
data:
  valheim.json: |
    {
      "title": "Valheim",
      "uid": "kubicvalheim",
      "schemaVersion": 39,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "templating": { "list": [] },
      "panels": [
        {
          "id": 1,
          "title": "Server Up",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "mappings": [
            { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
          ] } },
          "targets": [
            { "expr": "max(up{service=\"valheim-metrics\", namespace=\"kubicvalheim\"})", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Players Online",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [
            { "expr": "max(valheim_current_player_count{namespace=\"kubicvalheim\"})", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "CPU (cores)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"kubicvalheim\", container=\"valheim-server\"}[5m]))", "refId": "A", "legendFormat": "cpu" },
            { "expr": "sum(kube_pod_container_resource_requests{namespace=\"kubicvalheim\", container=\"valheim-server\", resource=\"cpu\"})", "refId": "B", "legendFormat": "request" }
          ]
        },
        {
          "id": 4,
          "title": "Memory (working set)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "sum(container_memory_working_set_bytes{namespace=\"kubicvalheim\", container=\"valheim-server\"})", "refId": "A", "legendFormat": "memory" },
            { "expr": "sum(kube_pod_container_resource_requests{namespace=\"kubicvalheim\", container=\"valheim-server\", resource=\"memory\"})", "refId": "B", "legendFormat": "request" },
            { "expr": "sum(kube_pod_container_resource_limits{namespace=\"kubicvalheim\", container=\"valheim-server\", resource=\"memory\"})", "refId": "C", "legendFormat": "limit" }
          ]
        },
        {
          "type": "stat",
          "title": "Backup age (hours)",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 14 },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0 },
                  { "color": "orange", "value": 2 },
                  { "color": "red", "value": 4 }
                ]
              }
            }
          },
          "targets": [
            { "expr": "max(valheim_backup_age_seconds{namespace=\"kubicvalheim\"}) / 3600", "refId": "A" }
          ]
        },
        {
          "type": "stat",
          "title": "Last GCS upload (hours)",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 14 },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0 },
                  { "color": "orange", "value": 30 },
                  { "color": "red", "value": 36 }
                ]
              }
            }
          },
          "targets": [
            { "expr": "max(valheim_backup_upload_age_seconds{namespace=\"kubicvalheim\"}) / 3600", "refId": "A" }
          ]
        },
        {
          "type": "stat",
          "title": "Published IP valid",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 14 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "IP DRIFT", "color": "red" }, "1": { "text": "OK", "color": "green" } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            { "expr": "count(kube_node_status_addresses{type=\"ExternalIP\", address=\"34.75.63.41\"}) or vector(0)", "refId": "A" }
          ]
        },
        {
          "type": "stat",
          "title": "Usable node IPs",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 14 },
          "options": { "textMode": "name" },
          "targets": [
            { "expr": "kube_node_status_addresses{type=\"ExternalIP\"}", "refId": "A", "legendFormat": "{{address}}" }
          ]
        }
      ]
    }
