apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valheim
  labels:
    # REQUIRED: heimdall's kube-prometheus-stack Prometheus selects ServiceMonitors
    # by this release label. Without it the target is never scraped.
    release: heimdall-kube-prometheus
    app.kubernetes.io/part-of: kubicvalheim
spec:
  selector:
    matchLabels:
      # Select ONLY the metrics Service. Matching on `app: valheim` alone would
      # also hit the game NodePort Service (same label), which has no `huginn`
      # port — making the operator log "port not found".
      app: valheim
      app.kubernetes.io/component: metrics
  # Copy the Service's `tafl_server` label onto every series from this target.
  # This is what lets the fleet dashboard say "Twinhenge" instead of
  # "valheim-twinhenge", and it applies to BOTH endpoints below — the backup
  # exporter emits no identifying labels of its own, so without this its metrics
  # are distinguishable only by namespace. huginn does emit `name`, but that is
  # the public NAME with its Kubic prefix; `tafl_server` is the internal one.
  targetLabels:
    - tafl_server

  endpoints:
    - port: huginn          # named TCP port on the valheim-metrics Service
      path: /metrics
      interval: 30s
    - port: backups         # busybox exporter on the valheim-metrics Service
      path: /metrics.txt    # NOT /metrics — see the sidecar comment in base
      interval: 60s
  # No namespaceSelector: default to same-namespace selection so this works in any
  # instance namespace (kubicvalheim, valheim-<name>, ...) rather than hardcoding one.
  # The ServiceMonitor and the valheim-metrics Service are always co-located.
