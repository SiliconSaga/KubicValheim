apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Opt-in observability: ServiceMonitor (scrapes Huginn /metrics) + Grafana dashboard.
# Logs require NOTHING here — the cluster-wide OTel Collector DaemonSet (heimdall)
# auto-collects pod stdout to Loki.
#
# Alerts here are the ones true for EVERY instance. Backup alerting is conditional
# on the overlay setting AUTO_BACKUP="1" and lives in components/observability-backups.
#
# Two Grafana dashboards, deliberately not merged: dashboard-configmap.yaml
# (uid kubicvalheim) hardcodes namespace="kubicvalheim" and only ever shows that
# one instance. dashboard-tafl-configmap.yaml (uid tafl-valheim) is the
# multi-instance successor — a $namespace template variable serves every
# instance from one dashboard via a dropdown. Distinct uids matter: two
# ConfigMaps sharing a uid overwrite each other in Grafana.
resources:
  - servicemonitor.yaml
  - dashboard-configmap.yaml
  - dashboard-tafl-configmap.yaml
  - prometheusrule.yaml
