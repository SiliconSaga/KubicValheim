apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Opt-in per-instance observability: the ServiceMonitor that scrapes this
# instance's Huginn /metrics. Logs require NOTHING here — the cluster-wide OTel
# Collector DaemonSet (heimdall) auto-collects pod stdout to Loki.
#
# ONLY the ServiceMonitor lives here, and the reason is worth keeping. It is the
# one piece that is genuinely per-instance: it selects the `valheim-metrics`
# Service by label and carries no namespaceSelector, so it must sit in the same
# namespace as the Service it scrapes.
#
# The Grafana dashboard and the alert rules moved to kustomize/fleet, which is
# applied ONCE per cluster. They were never per-instance in anything but
# deployment: the dashboard has a fixed uid, and PrometheusRule expressions are
# not scoped to the namespace the rule object lives in — so N copies each
# evaluated the whole fleet and a fix applied to one namespace was silently
# defeated by the others. See kustomize/fleet/kustomization.yaml for the full
# account.
#
# Backup alerting is conditional on the overlay setting AUTO_BACKUP="1" and
# still lives in components/observability-backups. It has the same unscoped-
# expression shape as the rules that moved, but moving it would also make it
# unconditional, which would change behaviour for any instance that runs with
# backups off — that trade wants its own decision rather than riding along here.
resources:
  - servicemonitor.yaml
