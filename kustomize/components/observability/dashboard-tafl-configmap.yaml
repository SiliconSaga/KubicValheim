apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-dashboard-tafl
  labels:
    # The kube-prometheus-stack Grafana sidecar auto-imports ConfigMaps with this label.
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: kubicvalheim
# NO namespace variable. This dashboard used to have one, and picking a server
# from a dropdown was the wrong shape for a fleet: in practice people play on one
# server at a time but want to know what ALL of them are doing, and every
# genuinely fleet-wide panel had to carry a comment explaining that it ignored the
# variable it appeared to be filtered by. Every panel below now shows the whole
# fleet with one series per server.
#
# Series are named by `tafl_server`, a label the ServiceMonitor copies off the
# metrics Service (see components/observability/servicemonitor.yaml). Two panels
# need it on metrics that do NOT come from our own exporters — CPU and memory come
# from cAdvisor, which only knows the namespace — so those join it back on:
#
#   * on(namespace) group_left(tafl_server)
#       topk by (namespace) (1,
#         max by (namespace, tafl_server) (up{service="valheim-metrics", tafl_server!=""}))
#
# The join source is deliberately unscoped by endpoint: it exists only to carry a
# label, so either endpoint being scraped is enough to keep a server's line named.
#
# BOTH GUARDS ON THAT JOIN ARE LOAD-BEARING, and the plain form was caught failing
# in production during this rollout. A group_left's right-hand side must be unique
# per matching label set; the moment one namespace has two `tafl_server` values,
# Prometheus rejects the ENTIRE query and the panel renders an error rather than a
# gap. That happens whenever the label changes — during the initial relabel, while
# stale unlabelled series are still fresh alongside new labelled ones, and again on
# any future rename. `tafl_server!=""` drops the unlabelled leftovers and `topk by
# (namespace) (1, ...)` guarantees uniqueness even mid-rename.
#
# Both the CPU and Memory panels plot usage against request AND limit. That only
# works because base/deployment.yaml declares both limits (cpu 1500m, memory
# 8Gi) — a series querying kube_pod_container_resource_limits for a resource
# with no limit set returns nothing and renders as a permanently flat line,
# which reads as broken scraping rather than as "no limit". If a limit is ever
# removed from the Deployment, drop its series here in the same change.
#
# Published-IP drift is NOT here any more. It was never a Valheim condition —
# one A record serves every hosted game — so it moved to the tafl component
# (kustomize/fleet/published-ip.yaml) and surfaces on the Heimdall Overview.
data:
  tafl-valheim.json: |
    {
      "title": "Tafl — Valheim Fleet",
      "uid": "tafl-valheim",
      "schemaVersion": 39,
      "editable": true,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Loki datasource",
            "query": "loki",
            "refresh": 1,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Server status",
          "type": "state-timeline",
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "description": "State per server across the window, one row each. Four states, because 'off on purpose' and 'broken' are different facts and colouring both red trains you to ignore the panel: BLUE dormant (spec replicas 0 — a human parked it), GREEN online, YELLOW scrapeable but not accepting players (valheim_online 0 — the cautionary middle), RED wanted but not running. A timeline rather than the stat tiles this began as: tiles grow sideways until none are legible, a timeline grows downward, and it shows whether a server was solidly up or flapping. KEYED ON NAMESPACE, NOT `tafl_server`, and that is the whole trick — `tafl_server` is a target label copied from the Service, so it exists only while something is being scraped, and a dormant server would vanish from this panel entirely rather than show blue. kube-state-metrics keeps reporting the Deployment whatever state it is in, so the state expression is built from `kube_deployment_spec_replicas` and only consults scrape-derived series for the live states. The display name is derived from the namespace by label_replace; real `tafl_server` names would need that label added to kube-state-metrics' --metric-labels-allowlist in heimdall, which is the productionisation step. Resource and player-count panels below still lose a dormant server, which is correct — there is genuinely nothing to plot.",
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(label_replace((max by (namespace) (kube_deployment_spec_replicas{deployment=\"valheim\"}) == 0) or (max by (namespace) (valheim_online) == 1) or ((max by (namespace) (valheim_online) == 0) + 2) or ((max by (namespace) (kube_deployment_spec_replicas{deployment=\"valheim\"}) > 0) * 0 + 3), \"server\", \"$1\", \"namespace\", \"(.*)\"), \"server\", \"$1\", \"namespace\", \"valheim-(.*)\")",
              "legendFormat": "{{server}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 80,
                "spanNulls": false
              },
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DORMANT",
                      "color": "blue",
                      "index": 0
                    },
                    "1": {
                      "text": "ONLINE",
                      "color": "green",
                      "index": 1
                    },
                    "2": {
                      "text": "NOT ACCEPTING",
                      "color": "yellow",
                      "index": 2
                    },
                    "3": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 3
                    }
                  }
                }
              ],
              "noValue": "no data"
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "alignValue": "center",
            "rowHeight": 0.9,
            "perPage": 20,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        },
        {
          "id": 2,
          "title": "Server intent",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "description": "The counterpart to the timeline, and the reason this dashboard does not rely on `up` alone. Scale an instance to zero and its `up` series stops EXISTING rather than reporting 0, so it silently leaves every scrape-derived panel — while kube-state-metrics keeps reporting the Deployment whatever state it is in. Read it as one invariant: REGISTERED = DORMANT + REPORTING. When that holds, every server is either deliberately parked or healthy, and there is nothing to do. When registered exceeds dormant + reporting, the difference is servers that are supposed to be running and are not — the one number worth acting on. Splitting 'dormant' out of what used to be a bare registered-vs-reporting gap is what makes a parked server readable as intent rather than as a shortfall. `reporting` counts NAMESPACES rather than `up` series: during a relabel a target briefly has both an old and a new series, which counted 5 of 3 servers until the stale ones aged out. Instant query, not a range one — a stat tile means 'right now', and reducing a range keeps rendering a tile for any series that existed earlier in the window, which is how a phantom fourth server once appeared from pre-relabel data.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "dormant"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "reporting"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "count(kube_deployment_spec_replicas{deployment=\"valheim\"}) or vector(0)",
              "refId": "A",
              "legendFormat": "registered",
              "instant": true
            },
            {
              "expr": "count(kube_deployment_spec_replicas{deployment=\"valheim\"} == 0) or vector(0)",
              "refId": "B",
              "legendFormat": "dormant",
              "instant": true
            },
            {
              "expr": "count(max by (namespace) (up{service=\"valheim-metrics\", endpoint=\"huginn\"}) == 1) or vector(0)",
              "refId": "C",
              "legendFormat": "reporting",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "title": "Players online now",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "description": "Fleet total across every server. The per-server breakdown is the timeseries below. Shows the number alone — it sits in a row of per-server tiles, and with a name attached Grafana rendered it as a fourth server called \"Value\". Instant query, not a range one: a stat tile means 'right now', and reducing a range would keep rendering a tile for any series that existed earlier in the window — which is how a fourth `unlabelled` server appeared after the relabel, built from data older than the change.",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(valheim_current_player_count) or vector(0)",
              "refId": "A",
              "legendFormat": "fleet total",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "id": 4,
          "title": "Players online",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "description": "History, not just a current count — shows joins and leaves over time, one line per server. `valheim_current_player_count` comes from huginn, which also emits its own `name` label; this uses `tafl_server` instead so the legend matches every other panel and drops the public Kubic prefix. An empty `tafl_server` is renamed to `unlabelled` rather than dropped: Grafana has no name for an empty label and falls back to calling the field \"Value\", but filtering the series out instead would hide an unmigrated instance, which is the one most worth seeing.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "spanNulls": true
              }
            }
          },
          "targets": [
            {
              "expr": "label_replace(max by (tafl_server) (valheim_current_player_count), \"tafl_server\", \"unlabelled\", \"tafl_server\", \"^$\")",
              "refId": "A",
              "legendFormat": "{{tafl_server}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "CPU (cores)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "description": "One usage line per server, plus the per-instance request and limit as fleet-wide reference lines (every instance shares base's values, so plotting them per server would draw three identical lines). Usage comes from cAdvisor, which knows only the namespace, so the server name is joined back on from `up` — see the header comment.",
          "targets": [
            {
              "expr": "sum by (tafl_server) (rate(container_cpu_usage_seconds_total{container=\"valheim-server\"}[5m]) * on(namespace) group_left(tafl_server) topk by (namespace) (1, max by (namespace, tafl_server) (up{service=\"valheim-metrics\", tafl_server!=\"\"})))",
              "refId": "A",
              "legendFormat": "{{tafl_server}}"
            },
            {
              "expr": "max(kube_pod_container_resource_requests{container=\"valheim-server\", resource=\"cpu\"})",
              "refId": "B",
              "legendFormat": "request (each)"
            },
            {
              "expr": "max(kube_pod_container_resource_limits{container=\"valheim-server\", resource=\"cpu\"})",
              "refId": "C",
              "legendFormat": "limit (each)"
            }
          ]
        },
        {
          "id": 6,
          "title": "Memory (working set)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "description": "Same shape as CPU: one line per server, request and limit as per-instance reference lines.",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "targets": [
            {
              "expr": "sum by (tafl_server) (container_memory_working_set_bytes{container=\"valheim-server\"} * on(namespace) group_left(tafl_server) topk by (namespace) (1, max by (namespace, tafl_server) (up{service=\"valheim-metrics\", tafl_server!=\"\"})))",
              "refId": "A",
              "legendFormat": "{{tafl_server}}"
            },
            {
              "expr": "max(kube_pod_container_resource_requests{container=\"valheim-server\", resource=\"memory\"})",
              "refId": "B",
              "legendFormat": "request (each)"
            },
            {
              "expr": "max(kube_pod_container_resource_limits{container=\"valheim-server\", resource=\"memory\"})",
              "refId": "C",
              "legendFormat": "limit (each)"
            }
          ]
        },
        {
          "id": 7,
          "title": "Local backup age (hours)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 21
          },
          "description": "One tile per server. The backup-exporter reports -1 as its sentinel for 'no local backup exists yet' — the thresholds key green off 0 specifically so that sentinel reads as unhealthy (base/red) rather than accidentally healthy. An empty `tafl_server` is renamed to `unlabelled` rather than dropped: Grafana has no name for an empty label and falls back to calling the field \"Value\", but filtering the series out instead would hide an unmigrated instance, which is the one most worth seeing. Instant query, not a range one: a stat tile means 'right now', and reducing a range would keep rendering a tile for any series that existed earlier in the window — which is how a fourth `unlabelled` server appeared after the relabel, built from data older than the change.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "red",
                    "value": 4
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "label_replace(max by (tafl_server) (valheim_backup_age_seconds) / 3600, \"tafl_server\", \"unlabelled\", \"tafl_server\", \"^$\")",
              "refId": "A",
              "legendFormat": "{{tafl_server}}",
              "instant": true
            }
          ]
        },
        {
          "id": 8,
          "title": "Off-cluster upload age (hours)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 21
          },
          "description": "The panel that matters most and is easiest to misread. It reports the age of the .last-upload marker, which backup-server.sh touches ONLY after a confirmed gsutil upload — so this is the one number that means 'a world left the cluster', as opposed to the panel on its left, which only means 'odin ran'. Same -1 'never' sentinel, same reason the thresholds key green off 0. Red here with green to the left is the specific state that looks fine and is not: local backups piling up on a PVC that dies with the cluster. An empty `tafl_server` is renamed to `unlabelled` rather than dropped: Grafana has no name for an empty label and falls back to calling the field \"Value\", but filtering the series out instead would hide an unmigrated instance, which is the one most worth seeing. Instant query, not a range one: a stat tile means 'right now', and reducing a range would keep rendering a tile for any series that existed earlier in the window — which is how a fourth `unlabelled` server appeared after the relabel, built from data older than the change.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 30
                  },
                  {
                    "color": "red",
                    "value": 36
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "label_replace(max by (tafl_server) (valheim_backup_upload_age_seconds) / 3600, \"tafl_server\", \"unlabelled\", \"tafl_server\", \"^$\")",
              "refId": "A",
              "legendFormat": "{{tafl_server}}",
              "instant": true
            }
          ]
        },
        {
          "id": 9,
          "title": "Local backups retained",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 21
          },
          "description": "Tarball count on each instance's backup PVC. odin prunes to AUTO_BACKUP_DAYS_TO_LIVE (1), so a count settling above ~24, or steadily climbing means pruning is not running and the PVC will eventually fill; a count stuck at 1 means each backup is replacing the last. An empty `tafl_server` is renamed to `unlabelled` rather than dropped: Grafana has no name for an empty label and falls back to calling the field \"Value\", but filtering the series out instead would hide an unmigrated instance, which is the one most worth seeing. Instant query, not a range one: a stat tile means 'right now', and reducing a range would keep rendering a tile for any series that existed earlier in the window — which is how a fourth `unlabelled` server appeared after the relabel, built from data older than the change.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "label_replace(max by (tafl_server) (valheim_backup_count), \"tafl_server\", \"unlabelled\", \"tafl_server\", \"^$\")",
              "refId": "A",
              "legendFormat": "{{tafl_server}}",
              "instant": true
            }
          ]
        },
        {
          "id": 10,
          "title": "Player connects / disconnects",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "Loki via the heimdall Datasource variable above (its exact provisioned name/uid wasn't pinned down, so this dashboard picks it by type instead of hardcoding a name). Now unfiltered across the fleet, so `showLabels` is on — the stream's k8s_namespace_name is what tells you which server a line came from, since the log text itself does not say. Target A (joins) logs the player's NAME; target B (leaves) logs their SteamID instead — the two identifiers are asymmetric, so don't expect the same string to show up in both directions for one player. The namespace regex has to match both `kubicvalheim` (valheim7 is grandfathered) and the `valheim-<slug>` convention everything since follows.",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "expr": "{k8s_namespace_name=~\"kubicvalheim|valheim-.+\"} |= \"Got character ZDOID\"",
              "refId": "A",
              "legendFormat": "join",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "{k8s_namespace_name=~\"kubicvalheim|valheim-.+\"} |= \"Closing socket\"",
              "refId": "B",
              "legendFormat": "leave",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "id": 11,
          "title": "Usable node IPs",
          "type": "table",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "description": "Every node ExternalIP in the cluster — the answer to 'what do I repoint DNS at?' Kept on this dashboard even though the drift ALERT moved to tafl and the Heimdall Overview, because this is the remediation aid and a Valheim alert is what lands you here. Under externalTrafficPolicy: Cluster ANY of these serves the NodePorts, so every row is a valid choice; pick one and update BOTH the A record and tafl's kustomize/fleet/published-ip.yaml.",
          "targets": [
            {
              "expr": "kube_node_status_addresses{type=\"ExternalIP\"}",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ]
        }
      ]
    }
