apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-dashboard-tafl
  labels:
    # The kube-prometheus-stack Grafana sidecar auto-imports ConfigMaps with this label.
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: kubicvalheim
# NO namespace variable. This dashboard used to have one, and picking a server
# from a dropdown was the wrong shape for a fleet: in practice people play on one
# server at a time but want to know what ALL of them are doing, and every
# genuinely fleet-wide panel had to carry a comment explaining that it ignored the
# variable it appeared to be filtered by. Every panel below now shows the whole
# fleet with one series per server.
#
# Series are named by `tafl_server`, a label the ServiceMonitor copies off the
# metrics Service (see components/observability/servicemonitor.yaml). Two panels
# need it on metrics that do NOT come from our own exporters — CPU and memory come
# from cAdvisor, which only knows the namespace — so those join it back on:
#
#   * on(namespace) group_left(tafl_server)
#       topk by (namespace) (1,
#         max by (namespace, tafl_server) (up{service="valheim-metrics", tafl_server!=""}))
#
# The join source is deliberately unscoped by endpoint: it exists only to carry a
# label, so either endpoint being scraped is enough to keep a server's line named.
#
# BOTH GUARDS ON THAT JOIN ARE LOAD-BEARING, and the plain form was caught failing
# in production during this rollout. A group_left's right-hand side must be unique
# per matching label set; the moment one namespace has two `tafl_server` values,
# Prometheus rejects the ENTIRE query and the panel renders an error rather than a
# gap. That happens whenever the label changes — during the initial relabel, while
# stale unlabelled series are still fresh alongside new labelled ones, and again on
# any future rename. `tafl_server!=""` drops the unlabelled leftovers and `topk by
# (namespace) (1, ...)` guarantees uniqueness even mid-rename.
#
# Both the CPU and Memory panels plot usage against request AND limit. That only
# works because base/deployment.yaml declares both limits (cpu 1500m, memory
# 8Gi) — a series querying kube_pod_container_resource_limits for a resource
# with no limit set returns nothing and renders as a permanently flat line,
# which reads as broken scraping rather than as "no limit". If a limit is ever
# removed from the Deployment, drop its series here in the same change.
#
# Published-IP drift is NOT here any more. It was never a Valheim condition —
# one A record serves every hosted game — so it moved to the tafl component
# (kustomize/fleet/published-ip.yaml) and surfaces on the Heimdall Overview.
data:
  tafl-valheim.json: |
    {
      "title": "Tafl — Valheim Fleet",
      "uid": "tafl-valheim",
      "schemaVersion": 39,
      "editable": true,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Loki datasource",
            "query": "loki",
            "refresh": 1,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Server status",
          "type": "state-timeline",
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "description": "Per-server state over time. Blue is dormant (deliberately scaled to zero), green online, yellow running but not accepting players, red wanted but not running.",
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(label_replace((max by (namespace) (kube_deployment_spec_replicas{deployment=\"valheim\"}) == 0) or (max by (namespace) (valheim_online) == 1) or ((max by (namespace) (valheim_online) == 0) + 2) or ((max by (namespace) (kube_deployment_spec_replicas{deployment=\"valheim\"}) > 0) * 0 + 3), \"server\", \"$1\", \"namespace\", \"(.*)\"), \"server\", \"$1\", \"namespace\", \"valheim-(.*)\")",
              "legendFormat": "{{server}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 80,
                "spanNulls": false
              },
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  },
                  {
                    "color": "yellow",
                    "value": 2
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DORMANT",
                      "color": "blue",
                      "index": 0
                    },
                    "1": {
                      "text": "ONLINE",
                      "color": "green",
                      "index": 1
                    },
                    "2": {
                      "text": "NOT ACCEPTING",
                      "color": "yellow",
                      "index": 2
                    },
                    "3": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 3
                    }
                  }
                }
              ],
              "noValue": "no data"
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "alignValue": "center",
            "rowHeight": 0.9,
            "perPage": 20,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        },
        {
          "id": 2,
          "title": "Server intent",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "description": "Registered = dormant + reporting whenever the fleet is healthy. Any excess is servers that are supposed to be running and are not.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "dormant"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "reporting"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "count(max by (namespace) (kube_deployment_spec_replicas{deployment=\"valheim\"})) or vector(0)",
              "refId": "A",
              "legendFormat": "registered",
              "instant": true
            },
            {
              "expr": "count(max by (namespace) (kube_deployment_spec_replicas{deployment=\"valheim\"}) == 0) or vector(0)",
              "refId": "B",
              "legendFormat": "dormant",
              "instant": true
            },
            {
              "expr": "count((max by (namespace) (up{service=\"valheim-metrics\", endpoint=\"huginn\"}) == 1) and on (namespace) (max by (namespace) (kube_deployment_spec_replicas{deployment=\"valheim\"}) > 0)) or vector(0)",
              "refId": "C",
              "legendFormat": "reporting",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "title": "Players online now",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "description": "Fleet-wide player count right now. The per-server breakdown is the graph below.",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(valheim_current_player_count) or vector(0)",
              "refId": "A",
              "legendFormat": "fleet total",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "id": 4,
          "title": "Players online",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "description": "Players per server over time, so joins and leaves are visible. An instance with no name label shows as `unlabelled` rather than being hidden.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "spanNulls": true
              }
            }
          },
          "targets": [
            {
              "expr": "label_replace(max by (tafl_server) (valheim_current_player_count), \"tafl_server\", \"unlabelled\", \"tafl_server\", \"^$\")",
              "refId": "A",
              "legendFormat": "{{tafl_server}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "CPU (cores)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "description": "Usage per server, against the request and limit every instance shares. Usage comes from cAdvisor, so the server name is joined on from `up`.",
          "targets": [
            {
              "expr": "sum by (tafl_server) (rate(container_cpu_usage_seconds_total{container=\"valheim-server\"}[5m]) * on(namespace) group_left(tafl_server) topk by (namespace) (1, max by (namespace, tafl_server) (up{service=\"valheim-metrics\", tafl_server!=\"\"})))",
              "refId": "A",
              "legendFormat": "{{tafl_server}}"
            },
            {
              "expr": "max(kube_pod_container_resource_requests{container=\"valheim-server\", resource=\"cpu\"})",
              "refId": "B",
              "legendFormat": "request (each)"
            },
            {
              "expr": "max(kube_pod_container_resource_limits{container=\"valheim-server\", resource=\"cpu\"})",
              "refId": "C",
              "legendFormat": "limit (each)"
            }
          ]
        },
        {
          "id": 6,
          "title": "Memory (working set)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "description": "Usage per server, against the request and limit every instance shares.",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "targets": [
            {
              "expr": "sum by (tafl_server) (container_memory_working_set_bytes{container=\"valheim-server\"} * on(namespace) group_left(tafl_server) topk by (namespace) (1, max by (namespace, tafl_server) (up{service=\"valheim-metrics\", tafl_server!=\"\"})))",
              "refId": "A",
              "legendFormat": "{{tafl_server}}"
            },
            {
              "expr": "max(kube_pod_container_resource_requests{container=\"valheim-server\", resource=\"memory\"})",
              "refId": "B",
              "legendFormat": "request (each)"
            },
            {
              "expr": "max(kube_pod_container_resource_limits{container=\"valheim-server\", resource=\"memory\"})",
              "refId": "C",
              "legendFormat": "limit (each)"
            }
          ]
        },
        {
          "id": 7,
          "title": "Local backup age (hours)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 21
          },
          "description": "Age of each server's newest local backup. `-1` means none exist yet and reads red.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "red",
                    "value": 4
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "label_replace(max by (tafl_server) (valheim_backup_age_seconds) / 3600, \"tafl_server\", \"unlabelled\", \"tafl_server\", \"^$\")",
              "refId": "A",
              "legendFormat": "{{tafl_server}}",
              "instant": true
            }
          ]
        },
        {
          "id": 8,
          "title": "Off-cluster upload age (hours)",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 21
          },
          "description": "Age of each server's last confirmed upload to GCS \u2014 the number that means a world actually left the cluster. Red here beside green on the left is the state that looks fine and is not.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 30
                  },
                  {
                    "color": "red",
                    "value": 36
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "label_replace(max by (tafl_server) (valheim_backup_upload_age_seconds) / 3600, \"tafl_server\", \"unlabelled\", \"tafl_server\", \"^$\")",
              "refId": "A",
              "legendFormat": "{{tafl_server}}",
              "instant": true
            }
          ]
        },
        {
          "id": 9,
          "title": "Local backups retained",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 21
          },
          "description": "Tarball count on each server's backup PVC. A steadily climbing count means pruning has stopped.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "label_replace(max by (tafl_server) (valheim_backup_count), \"tafl_server\", \"unlabelled\", \"tafl_server\", \"^$\")",
              "refId": "A",
              "legendFormat": "{{tafl_server}}",
              "instant": true
            }
          ]
        },
        {
          "id": 10,
          "title": "Player connects / disconnects",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "description": "Join and leave lines across the fleet, from Loki. Joins log a player name, leaves log a SteamID.",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "expr": "{k8s_namespace_name=~\"kubicvalheim|valheim-.+\"} |= \"Got character ZDOID\"",
              "refId": "A",
              "legendFormat": "join",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "{k8s_namespace_name=~\"kubicvalheim|valheim-.+\"} |= \"Closing socket\"",
              "refId": "B",
              "legendFormat": "leave",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              }
            }
          ]
        }
      ]
    }
