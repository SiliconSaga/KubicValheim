apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim
spec:
  template:
    spec:
      containers:
        - name: valheim-server
          env:
            - name: NAME
              value: "KubicHelheim"
            - name: WORLD
              value: "valheim3"
            # Free building: no material cost. Everything else stays vanilla.
            # Matches Jotunheim.
            #
            # NOTE: -setkey writes into the world DB PERMANENTLY. This env var is a
            # one-time TRIGGER, not a declaration — deleting it later will NOT turn
            # free building back off, which needs `removekey nobuildcost` from the
            # in-game console as an admin. It is kept here as the record of intent;
            # the world itself is the source of truth.
            - name: SET_KEY
              value: "nobuildcost"
---
# The metrics Service carries this instance's display name so the ServiceMonitor's
# `targetLabels` can stamp it onto every series scraped from it — huginn's game
# metrics AND the backup exporter's, neither of which would otherwise say which
# server they came from. Without it the fleet dashboard can only label lines by
# namespace, and `valheim-valheim3` is not a name anyone wants to read on a graph.
#
# Deliberately WITHOUT the `Kubic` prefix that `NAME` carries. NAME is public — it
# is what players see in Valheim's Community browser, where the prefix is what
# makes our servers findable as a group by searching "Kubic". This label is
# internal, seen only on dashboards that show nothing but our own fleet, so the
# prefix would be noise repeated on every line.
apiVersion: v1
kind: Service
metadata:
  name: valheim-metrics
  labels:
    tafl_server: Helheim
