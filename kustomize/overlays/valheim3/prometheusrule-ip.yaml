# Published-IP drift for the valheim3 instance.
#
# THIRD near-identical copy of this rule (valheim7, twinhenge, valheim3), all
# watching the SAME address, because all three share the play.terasology.org A
# record and are distinguished only by port. That is worth revisiting: the
# published IP is a property of the DNS record, not of an instance, so one node
# roll now raises three alerts for one problem — Alertmanager groups by
# [alertname, namespace], so three namespaces means three pages. Consolidating to
# a single fleet-wide rule would page once and say "all Valheim instances are
# unreachable", which is both truer and quieter; the cost is that the dashboard's
# drift panel would drop its $namespace filter, since the condition is not
# per-instance. Left per-instance here for consistency with the other two rather
# than changing the pattern mid-migration.
#
# WHEN THE PUBLISHED IP CHANGES, update every overlay's rule plus the A record.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: valheim-published-ip
  labels:
    app.kubernetes.io/part-of: kubicvalheim
spec:
  groups:
    - name: valheim-published-ip
      rules:
        # The `and on()` guard is load-bearing, not decoration. A bare absent()
        # is also true when kube-state-metrics is down, because then EVERY
        # node-address series disappears — so a telemetry outage would raise a
        # critical, watched-tier page claiming the published IP had drifted, and
        # the runbook it points at says "repoint DNS", which would be actively
        # wrong.
        - alert: ValheimPublishedIPDrift
          expr: >-
            absent(kube_node_status_addresses{type="ExternalIP", address="34.75.63.41"})
            and on() (count(kube_node_status_addresses{type="ExternalIP"}) > 0)
          for: 5m
          labels:
            severity: critical
            watched: "true"
            # Static label: absent() over a cluster-global metric yields only the
            # matcher's labels, so this alert carries no namespace of its own and
            # the fleet dashboard's ALERTS-based panel could not attribute it.
            namespace: valheim-valheim3
          annotations:
            summary: "valheim3: play.terasology.org points at 34.75.63.41, which is no longer any node's external IP"
            description: "34.75.63.41 does not belong to any current node — it was likely destroyed in a node roll, so play.terasology.org:32486 resolves to nothing players can reach. Repoint the A record at any current node's external IP and update every overlay's rule to match; under externalTrafficPolicy: Cluster any node serves the NodePort."
