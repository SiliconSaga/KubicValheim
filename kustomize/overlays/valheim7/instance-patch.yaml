apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim
spec:
  template:
    spec:
      containers:
        - name: valheim-server
          env:
            # --- CONFIRM THESE BEFORE APPLY ---
            # NAME is the server-browser display name; WORLD names the save file.
            # Changing WORLD after first boot creates a NEW empty world, so get it
            # right the first time.
            - name: NAME
              value: "KubicValheim7"
            - name: WORLD
              value: "Jotunheim"
            # Free building: no material cost. Everything else stays vanilla.
            # NOTE: -setkey writes into the world DB PERMANENTLY. Removing this env
            # var later will NOT turn it back off — that needs `removekey nobuildcost`
            # from the in-game console as an admin.
            - name: SET_KEY
              value: "nobuildcost"
