apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: valheim-published-ip
  labels:
    app.kubernetes.io/part-of: kubicvalheim
spec:
  groups:
    - name: valheim-published-ip
      rules:
        # kube_node_status_addresses and kube_pod_info both carry a `node` label, so
        # the join asks: "is the published IP the external IP of the node currently
        # running the server?" When the pod moves or the node's IP is recycled the
        # join yields nothing and absent() fires.
        #
        # UPDATE THE address= VALUE whenever the published IP legitimately changes
        # (and update Namecheap DNS to match).
        #
        # Gated with `and on() (count(...) > 0)` so this alert is scoped to "a pod
        # exists but is on the wrong node" only. Bare absent(), unguarded, also goes
        # true when NO valheim pod exists at all — i.e. during any ordinary outage —
        # which would page this as a second, CRITICAL alert alongside ValheimDown,
        # and its remediation ("check the dashboard's Correct IP right now panel")
        # is actively misleading with no pod up to report one. Pod-absence is left
        # entirely to ValheimDown; this alert only fires when a pod is genuinely on
        # the wrong node. Verified by hand (promtool unavailable in this environment):
        # absent(<join>) resolves to a single, label-less {} sample (its argument is
        # a compound expression, not a simple selector, so absent() can't infer
        # labels from it) valued 1 whenever the join has no match — including both
        # "wrong node" and "no pod at all". `count(kube_pod_status_phase{...}) > 0`
        # is also label-less {}: present (1 sample) when a Running pod exists, and
        # absent (0 samples, filtered out by `> 0`) when it doesn't. `and on()`
        # matches both sides on the empty label set, so the result is non-empty only
        # when BOTH operands have a sample — i.e. only when a Running pod exists AND
        # the join still found no matching node/IP pair. When no pod exists, the RHS
        # vector is empty, `and` has nothing to match against, and the whole
        # expression evaluates to empty (no fire) regardless of what absent() alone
        # would say.
        #
        # The gate joins against kube_pod_status_phase{phase="Running"} == 1 rather
        # than kube_pod_info, deliberately: kube_pod_info exists for a pod in ANY
        # phase, including Pending and Terminating. During a `Recreate` rollout a new
        # pod can sit Pending on a different node — one it hasn't started serving
        # from yet — before the old one has fully gone; a kube_pod_info-gated check
        # would see "a pod exists" and open the gate while the join legitimately
        # mismatches, paging a false drift alert on an ordinary restart. `for: 5m`
        # narrows that window but does not close it, since Pending can outlast 5m
        # under a slow image pull. Restricting the gate to Running closes it: the
        # gate only opens once a pod is actually serving from some node, which is
        # exactly when a node mismatch is real drift rather than rollout mechanics.
        - alert: ValheimPublishedIPDrift
          expr: >-
            (
              absent(
                kube_node_status_addresses{type="ExternalIP", address="34.26.181.102"}
                * on(node) group_left()
                max by(node) (kube_pod_info{namespace="kubicvalheim", pod=~"valheim-.*"})
              )
            )
            and on()
            (
              count(kube_pod_status_phase{namespace="kubicvalheim", pod=~"valheim-.*", phase="Running"} == 1) > 0
            )
          for: 5m
          labels:
            severity: critical
            watched: "true"
          annotations:
            summary: "Valheim published IP 34.26.181.102 no longer points at the server"
            description: "The server pod is not on the node holding 34.26.181.102. Players cannot connect. Check the dashboard's 'Correct IP right now' panel for the address to point DNS at."
