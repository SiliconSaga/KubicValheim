apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: valheim-published-ip
  labels:
    app.kubernetes.io/part-of: kubicvalheim
spec:
  groups:
    - name: valheim-published-ip
      rules:
        # This used to be a node-matching join, because externalTrafficPolicy: Local
        # made the pod's specific node load-bearing — if the pod wasn't on the node
        # holding the published IP, players couldn't connect. With
        # externalTrafficPolicy: Cluster, any node answers on the NodePort, so the
        # pod's node no longer matters at all. The only thing that can still break
        # players is the published address ceasing to be a node's external IP at
        # all (e.g. that node destroyed in a roll) — hence the simple absent() below.
        #
        # THE PUBLISHED NAME IS play.terasology.org — a single explicit A record,
        # on a domain that also carries many unrelated records. The address below
        # must match whatever that record currently points at; they are two halves
        # of one fact kept in two places, so changing one without the other either
        # silences a real outage or invents a fake one. This rule has already been
        # wrong once: it sat on 34.26.181.102 after a node roll destroyed that node,
        # firing permanently against an address nothing pointed at any more.
        #
        # WHEN THE PUBLISHED IP CHANGES, update BOTH:
        #   1. the play.terasology.org A record at Namecheap
        #   2. the address= below (and the summary text)
        #
        # NOTE for any future DNS automation: nordri's scripts/update-dns-namecheap.sh
        # is NOT safe to reuse here. It calls namecheap.domains.dns.setHosts with only
        # @ and *, and that API REPLACES the domain's entire record set — running it
        # against terasology.org would delete every other record on the domain. A
        # single-record updater is needed instead.
        # The `and on()` guard is load-bearing, not decoration. A bare absent()
        # is also true when kube-state-metrics itself is down, because then EVERY
        # node-address series disappears — so a telemetry outage would raise a
        # critical, DND-tier page claiming the published IP had drifted, and the
        # runbook it points at says "repoint DNS", which would be actively wrong.
        # Requiring at least one ExternalIP series to exist means the rule can
        # only fire when the exporter is reporting AND this specific address is
        # missing from what it reports. If kube-state-metrics dies, this alert
        # goes silent — correctly; that failure is kube-prometheus-stack's own
        # KubeStateMetricsDown to report, not ours to guess at.
        - alert: ValheimPublishedIPDrift
          expr: >-
            absent(kube_node_status_addresses{type="ExternalIP", address="34.75.63.41"})
            and on() (count(kube_node_status_addresses{type="ExternalIP"}) > 0)
          for: 5m
          labels:
            severity: critical
            watched: "true"
          annotations:
            summary: "valheim7: play.terasology.org points at 34.75.63.41, which is no longer any node's external IP"
            description: "34.75.63.41 does not belong to any current node — it was likely destroyed in a node roll, so play.terasology.org now resolves to nothing players can reach. Repoint the A record at any current node's external IP and update this rule's address= to match; under externalTrafficPolicy: Cluster any node serves the NodePort."
