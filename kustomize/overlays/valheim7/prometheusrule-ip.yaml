apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: valheim-published-ip
  labels:
    app.kubernetes.io/part-of: kubicvalheim
spec:
  groups:
    - name: valheim-published-ip
      rules:
        # This used to be a node-matching join, because externalTrafficPolicy: Local
        # made the pod's specific node load-bearing — if the pod wasn't on the node
        # holding the published IP, players couldn't connect. With
        # externalTrafficPolicy: Cluster, any node answers on the NodePort, so the
        # pod's node no longer matters at all. The only thing that can still break
        # players is the published address ceasing to be a node's external IP at
        # all (e.g. that node destroyed in a roll) — hence the simple absent() below.
        #
        # UPDATE THE address= VALUE whenever the published IP legitimately changes
        # (and update Namecheap DNS to match).
        - alert: ValheimPublishedIPDrift
          expr: >-
            absent(kube_node_status_addresses{type="ExternalIP", address="34.26.181.102"})
          for: 5m
          labels:
            severity: critical
            watched: "true"
          annotations:
            summary: "valheim7: published IP 34.26.181.102 is no longer any node's external IP"
            description: "34.26.181.102 does not belong to any current node — it was likely destroyed in a node roll. Repoint DNS at any current node's external IP; under externalTrafficPolicy: Cluster any node works."
